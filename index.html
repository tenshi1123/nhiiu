<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Nhi ❤️</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Nền trái tim bay */
        .heart-bg {
            position: absolute;
            color: rgba(255, 77, 109, 0.15);
            font-size: 20px;
            animation: float 5s linear infinite;
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(110vh) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px 25px;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(255, 77, 109, 0.2);
            text-align: center;
            width: 85%;
            max-width: 360px;
            z-index: 10;
            border: 5px solid #fff;
            position: relative;
        }

        /* Trang trí viền trên cho card */
        .card::before {
            content: "❤❤❤";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 5px 25px;
            border-radius: 20px;
            font-size: 0.9em;
            letter-spacing: 5px;
        }

        #sticker {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary);
            font-family: 'Dancing Script', cursive;
            font-size: 2.6em;
            margin: 10px 0;
        }

        p {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
            margin: 10px 0;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff85a1);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #aaa;
            position: fixed;
            z-index: 999;
        }

        .success-msg {
            display: none;
        }

        .success-msg h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary);
            font-size: 2.8em;
        }
    </style>
</head>

<body>

    <script>
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.className = 'heart-bg'; heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(heart);
        }
    </script>

    <div class="card">
        <img src="https://media.tenor.com/x9IaSHvZr-EAAAAi/tkthao219-bunny.gif" id="sticker" alt="Cute Sticker">

        <div id="content">
            <h1>Gửi Nhi ❤️</h1>
            <p>Từ lần đầu tiên anh đi bên em anh đã biết tim mình đánh rơi rồi...</p>
            <p><b>Làm người yêu anh nhé? 🥰</b></p>

            <div class="buttons">
                <button id="yesBtn">Đồng ý! ❤️</button>
                <button id="noBtn">Không</button>
            </div>
        </div>

        <div id="message" class="success-msg">
            <h2>Yeeee! I Love U❤️</h2>
            <img src="https://media.tenor.com/6S3YQ8mUv6AAAAAM/milk-and-mocha-love.gif" style="width: 150px;">
            <p style="font-size: 1.1em; color: var(--primary); font-weight: bold; margin-top: 15px;">
                Đang kết nối tới Tú Anh... <br> Em đợi một xíu nha!
            </p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const content = document.getElementById('content');
        const message = document.getElementById('message');
        const sticker = document.getElementById('sticker');

        // THAY LINK MESSENGER CỦA BẠN VÀO ĐÂY
        const MY_MESSENGER = "https://m.me/tenshi.2803";

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20) + 10;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20) + 10;
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); });

        yesBtn.addEventListener('click', () => {
            content.style.display = 'none';
            sticker.style.display = 'none';
            message.style.display = 'block';

            // Hiệu ứng pháo hoa
            var end = Date.now() + (5 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff85a1'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            // Tự động nhảy sang Messenger sau 4 giây
            setTimeout(() => {
                window.location.href = "https://tenshi1123.github.io/";
            }, 4000);
        });
    </script>
</body>

</html>

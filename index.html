<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Nhi ❤️</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff85a1;
            --bg-color: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Hiệu ứng trái tim bay nền */
        .heart-bg {
            position: absolute;
            color: rgba(255, 77, 109, 0.2);
            font-size: 20px;
            animation: float 6s linear infinite;
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.25);
            text-align: center;
            width: 85%;
            max-width: 360px;
            position: relative;
            z-index: 10;
            border: 4px solid #fff;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #sticker {
            width: 150px;
            /* Tăng kích thước sticker */
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-family: 'Dancing Script', cursive;
            font-size: 2.2em;
            margin: 10px 0;
        }

        p {
            color: #555;
            line-height: 1.5;
            font-size: 1.05em;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            height: 55px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            /* Bo tròn nút hơn */
            cursor: pointer;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff85a1);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:active {
            transform: scale(0.9);
        }

        #noBtn {
            background-color: #eee;
            color: #999;
            position: fixed;
            z-index: 999;
        }

        .success-msg {
            display: none;
        }

        .success-msg h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-color);
            font-size: 2.5em;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <script>
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.className = 'heart-bg';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
        }
    </script>

    <div class="card" id="mainCard">
        <img src="https://media.tenor.com/9v8X0yLOn_UAAAAM/milk-and-mocha-bear-couple.gif" id="sticker"
            alt="Cute Sticker">

        <div id="content">
            <h1 id="question">Gửi Nhi ❤️</h1>
            <p>
                Từ lúc gặp em, anh thấy cuộc sống này màu hồng hơn hẳn. <br>
                <b>Anh thích em lắm đó!</b>
            </p>
            <p>Làm người yêu anh nhé? 🥰</p>

            <div class="buttons">
                <button id="yesBtn">Đồng ý luôn! ❤️</button>
                <button id="noBtn">Khônggg</button>
            </div>
        </div>

        <div id="message" class="success-msg">
            <h2>Yeeee! ❤️</h2>
            <img src="https://media.tenor.com/X_8S6pEAnmYAAAAM/milk-and-mocha-hug.gif" style="width: 120px;" alt="Hug">
            <p style="font-weight: bold; color: #ff4d6d; margin-top: 15px;">
                I Love Youuu 💖 <br>
                Inbox cho anh ngay nha!
            </p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const content = document.getElementById('content');
        const message = document.getElementById('message');
        const sticker = document.getElementById('sticker');

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20) + 10;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20) + 10;
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            content.style.display = 'none';
            message.style.display = 'block';
            // Thay đổi sticker sang hình ôm nhau khi đồng ý
            sticker.src = "https://media.tenor.com/6S3YQ8mUv6AAAAAM/milk-and-mocha-love.gif";

            // Pháo hoa giấy
            var end = Date.now() + (10 * 1000);
            var colors = ['#ff4d6d', '#ff85a1', '#ffc8dd'];

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Em (Tên người ấy)</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffe4e1;
            /* Màu hồng nhạt lãng mạn */
            color: #8b0000;
            /* Màu đỏ đậm */
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ff69b4;
            /* Hồng đậm */
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .signature {
            margin-top: 30px;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Gửi Nhi - Em yêu!</h1>
        <p>
            Từ lần đầu tiên gặp em, anh đã biết trái tim mình đã tìm được bến đỗ.
            Mỗi khoảnh khắc bên em đều là niềm hạnh phúc tuyệt vời nhất.
            Anh viết những dòng này để nói với em rằng:
            **Anh yêu em rất nhiều!** ❤️
        </p>
        <p>
            Em có đồng ý làm người yêu của anh không?
        </p>
        <div class="signature">
            Thương nhớ, <br>
            Tú Anh
        </div>
    </div>
</body>

</html>
